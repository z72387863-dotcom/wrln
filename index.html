<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Untuk princes 16th - erlan Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFD6E7;overflow:hidden;font-family:'Fredoka',sans-serif;touch-action:none}
#gameWrap{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#FFC2D9 0%,#FFE4EC 100%)}
canvas{background:linear-gradient(180deg,#87D4FF 0%,#B9E8FF 35%,#FFE4EC 35%,#FFD6E7 100%);border-radius:24px;box-shadow:0 20px 60px rgba(255,100,150,0.3);display:block;max-width:95vw;max-height:90vh}
#rotate{position:fixed;inset:0;background:#FF8FAB;z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center}
#rotate h2{font-size:32px;margin-bottom:10px}
#rotate p{font-family:'Patrick Hand',cursive;font-size:20px}
@media (orientation:portrait){#rotate{display:flex} #gameWrap{display:none}}
#ui{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:white;padding:8px 20px;border-radius:30px;font-weight:700;box-shadow:0 4px 15px rgba(0,0,0,0.1);z-index:10}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.btn{width:70px;height:70px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 6px 20px rgba(0,0,0,0.15);user-select:none;cursor:pointer;border:4px solid #FF8FAB}
.btn:active{transform:scale(0.9)}
#endScreen{position:fixed;inset:0;background:rgba(255,214,231,0.97);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:auto}
#endScreen h1{font-size:48px;color:#FF2E7E;margin-bottom:10px}
#typeText{font-family:'Patrick Hand',cursive;font-size:22px;max-width:600px;color:#5A2A40;line-height:1.6;margin-top:15px;white-space:pre-wrap;text-align:left;background:white;padding:20px;border-radius:18px}
</style>
</head>
<body>
<div id="rotate"><h2>📱 puter hp kamu sayang ↻</h2><p>miringin hp biar gamenya luas </p></div>
<div id="gameWrap">
<div id="ui">bantu wulan ke babang ganteng! 💝 <span id="prog">0%</span></div>
<canvas id="c" width="1100" height="550"></canvas>
<div id="controls"><div style="display:flex;gap:12px"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div></div><div class="btn" id="jump">▲</div></div>
</div>
<div id="endScreen">
<h1>Happy Birthday princess kesayangan aku! 🎂💖</h1>
<p style="font-size:18px;color:#FF2E7E;font-weight:700">16 tahun, dari Babang Ganteng mu 💙</p>
<div id="typeText"></div>
